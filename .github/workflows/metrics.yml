name: GitHub Metrics

on:
  schedule:
    - cron: "0 0 * * *"      # refresh daily
  workflow_dispatch:          # lets you run it manually from the Actions tab
  push:
    branches: [main]

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Stats + activity overview (the "GitHub stats" card)
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: vedant-175
          template: classic
          filename: assets/github-stats.svg
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Kolkata
          commit_message: "chore: update GitHub stats"

      # Top languages card
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: vedant-175
          template: classic
          filename: assets/github-languages.svg
          base: ""
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          config_timezone: Asia/Kolkata
          commit_message: "chore: update top languages"

      # Contribution streak / activity card
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: vedant-175
          template: classic
          filename: assets/github-streak.svg
          base: ""
          plugin_streak: yes
          plugin_streak_days: 365
          config_timezone: Asia/Kolkata
          commit_message: "chore: update streak"
